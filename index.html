<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Chef's Table</title>

    <link
        rel="preconnect"
        href="https://fonts.googleapis.com"
    >

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin
    >

    <link
        href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@300;400;500;700&display=swap"
        rel="stylesheet"
    >

    <link
        rel="stylesheet"
        href="style.css"
    >
</head>

<body>

<div class="overlay"></div>

<div class="container">

    <header class="hero">

        <p class="subtitle">
            Premium Dining Experience
        </p>

        <h1>
            Chef's Table
        </h1>

        <p class="description">
            오늘 당신을 위한 특별한 메뉴를 추천합니다
        </p>

        <button
            class="recommend-btn"
            onclick="getMeal()"
        >
            ✨ 새로운 메뉴 추천
        </button>

    </header>

    <main class="layout">

        <section
            id="recipeCard"
            class="recipe-section"
        >

            <div class="loading-card">

                <div class="loader"></div>

                <p>
                    셰프가 메뉴를 준비하고 있습니다...
                </p>

            </div>

        </section>

        <aside class="bookmark-section">

            <div class="bookmark-header">

                <h2>
                    📖 나의 메뉴북
                </h2>

                <span id="bookmarkCount">
                    0개 저장됨
                </span>

            </div>

            <div id="bookmarks">

                <div class="empty-bookmark">
                    저장된 메뉴가 없습니다.
                </div>

            </div>

        </aside>

    </main>

</div>

<script src="script.js"></script>

</body>
</html>
